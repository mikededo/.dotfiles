"$schema" = 'https://starship.rs/config-schema.json'

# Prompt
format = """
$directory\
$character
"""
right_format = """
${custom.vcs}\
· \
$rust\
$lua\
$nodejs\
$cmd_duration\
$memory_usage\
$time\
"""
command_timeout = 1500
add_newline = false

# Colors use ANSI names so the terminal theme sets the actual colors.
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[directory]
style = "blue"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = ""
"Downloads" = ""
"/mnt/media" = " "

[cmd_duration]
min_time = 0                                # always show
format = "[$duration]($style)[·](brblack)"
style = "normal"
disabled = false

[memory_usage]
disabled = false
format = "[$symbol$ram_pct]($style) "
style = "magenta"
symbol = "⛁ "
threshold = 75

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
style = "normal"

[package]
format = "[$symbol$version]($style) "
style = "magenta"

[git_state]
disabled = true

[git_status]
disabled = true

[git_branch]
disabled = true

[custom.vcs]
when = "vcs-starship detect"
shell = ["vcs-starship", "--lines", "all"]
format = "$output "

[nodejs]
disabled = false
format = "[$symbol($version )]($style)"
style = "bold green"
not_capable_style = "bold red"

[rust]
disabled = false
format = "[$symbol($version)]($style) "
style = "bold red"
