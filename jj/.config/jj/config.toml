[user]
name = "Miquel de Domingo"
email = "miquelddg@gmail.com"

[ui]
editor = "nvim --cmd 'set runtimepath^=~/.config/nvim' -u NONE -c 'lua dofile(vim.fn.expand(\"~/.config/nvim/lua/config/options.lua\")); vim.opt.rtp:append(vim.fn.stdpath(\"config\"))'"
color = "auto"
default-command = "log"
pager = "delta"
diff-formatter = ":git"
git.subprocess = true
diff-editor = ":builtin"

[signing]
backend = "ssh"
behavior = "own"
key = "~/.ssh/github.pub"

[[--scope]]
--when.workspaces = ["~/Documents/work"]
[--scope.user]
email = "miquel.de.domingo@restream.io"
